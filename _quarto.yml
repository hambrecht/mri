project:
  type: website
  output-dir: "."
  pre-render: workflow/R/make_script.R
  render:
    - index.qmd
    - guide.qmd
    - sim.qmd
    - sim_multiplatform.qmd
    - sim_quadcopter.qmd
    - dl.qmd
    - workflow/index.qmd
    - workflow/data-formatting.qmd
    - workflow/covariates.qmd
    - workflow/detection-function.qmd
    - workflow/dsm.qmd
    - workflow/abundance.qmd
    - workflow/simulation-density.qmd
    - workflow/simulation-design.qmd
    - workflow/simulation-detectability.qmd
    - workflow/simulation-multispecies.qmd

website:
  title: "Moose Research Initiative — Theme 4"
  description: "Examining the feasibility of drones for wildlife surveys, as part of the Moose Research Initiative."
  site-url: "https://hambrecht.github.io/mri/"
  repo-url: "https://github.com/hambrecht/mri"
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    background: white
    foreground: dark
    left:
      - text: "IRSS"
        href: "https://irsslab.forestry.ubc.ca/"
        target: "_blank"
      - text: "fRI Research"
        href: "https://friresearch.ca/"
        target: "_blank"
    right:
      - icon: envelope
        href: "mailto:137965368+hambrecht@users.noreply.github.com"
        text: "Contact"
      - icon: github
        href: "https://github.com/hambrecht/mri"

  sidebar:
    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - text: "Home"
        href: index.qmd
      - text: "Best Practice Guide"
        href: guide.qmd
      - section: "Supporting Research"
        contents:
          - text: "Simulations Overview"
            href: sim.qmd
          - text: "Multi-platform Simulations"
            href: sim_multiplatform.qmd
          - text: "Quadcopter Simulations"
            href: sim_quadcopter.qmd
          - text: "Deep Learning"
            href: dl.qmd
      - section: "R Workflow"
        href: workflow/index.qmd
        contents:
          - text: "Formatting survey data"
            href: workflow/data-formatting.qmd
          - text: "Covariates and prediction grid"
            href: workflow/covariates.qmd
          - text: "Detection function"
            href: workflow/detection-function.qmd
          - text: "Density surface model"
            href: workflow/dsm.qmd
          - text: "Abundance and uncertainty"
            href: workflow/abundance.qmd
          - section: "Survey simulation"
            contents:
              - text: "From DSM to simulation"
                href: workflow/simulation-density.qmd
              - text: "Survey designs with subplots"
                href: workflow/simulation-design.qmd
              - text: "Spatially varying detectability"
                href: workflow/simulation-detectability.qmd
              - text: "Multi-species survey"
                href: workflow/simulation-multispecies.qmd

  page-footer:
    left: "Moose Research Initiative — Theme 4"
    right:
      - icon: github
        href: "https://github.com/hambrecht/mri"

execute:
  freeze: auto

format:
  html:
    theme: default
    toc: true
    toc-location: right
    number-sections: false
    grid:
      sidebar-width: 300px
      body-width: 850px
      margin-width: 250px
    fig-responsive: true
    link-external-newwindow: true
